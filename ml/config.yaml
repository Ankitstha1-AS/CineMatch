# Offline training configuration.
# Phase 0 only loads and validates this file; training arrives in Phase 2.

seed: 42

dataset:
  # Development uses the small MovieLens release; the final subset is fixed after EDA.
  name: ml-latest-small
  path: data/raw/ml-latest-small

split:
  # Per-user temporal hold-out described in AGENTS.md section 4.
  test_fraction: 0.2
  validation_fraction: 0.1

hybrid:
  alpha_max: 0.8
  alpha_min: 0.2
  decay: 0.1

evaluation:
  k_values: [5, 10, 20]
  relevance_threshold: 4.0
